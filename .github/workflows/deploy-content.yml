name: Deploy content site

# Reusable workflow that builds a content repo (logo, website, guides, …) with
# this master-builder pipeline and deploys it to GitHub Pages.
#
# Content repos call it with a thin caller workflow:
#
#   jobs:
#     deploy:
#       uses: Suomen-Palikkaharrastajat-ry/master-builder/.github/workflows/deploy-content.yml@main
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# The caller's own repository is checked out into `content/`; this repo (the
# build engine) is checked out at `builder_ref` into the workspace root.

on:
  workflow_call:
    inputs:
      builder_ref:
        description: "master-builder branch/tag/SHA to build with"
        required: false
        type: string
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master-builder (build engine)
        id: mb
        uses: actions/checkout@v4
        with:
          repository: Suomen-Palikkaharrastajat-ry/master-builder
          ref: ${{ inputs.builder_ref }}

      - name: Resolve builder SHA
        id: builder
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          path: content

      # Standard Debian toolchain (no Nix): the whole build toolchain — elm,
      # elm-format, lamdera, elm-pages, elm-tailwind-classes, vite, tailwind — is
      # declared in pkgs/package.json + pkgs/package-lock.json. A plain `npm ci`
      # runs the postinstall (`elm-tooling install && node
      # deploy/patch-tailwind-resolver.mjs`) which downloads the elm/elm-format/
      # lamdera binaries and patches the upstream tailwind-resolver bug. Nix is
      # still used for local dev / static analysis / tests.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkgs/package-lock.json

      # npm ci must run at the repo root so node_modules/ lands where the
      # Makefile and deploy/patch-tailwind-resolver.mjs expect it, and so
      # postinstall resolves elm-tooling.json and deploy/ relative to the root.
      - name: Stage package manifests at repo root
        run: cp pkgs/package.json pkgs/package-lock.json .

      - name: Restore deps + tool binaries
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.elm
          key: deps-${{ runner.os }}-${{ hashFiles('pkgs/package-lock.json', 'elm-tooling.json', 'elm.json', 'admin-app/elm.json') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Put tool binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Restore Elm compilation cache
        uses: actions/cache@v4
        with:
          path: |
            elm-stuff
            admin-app/elm-stuff
            .elm-pages
            .elm-tailwind
            gen
          key: elmbuild-${{ runner.os }}-${{ steps.builder.outputs.sha }}
          restore-keys: elmbuild-${{ runner.os }}-

      - name: Build
        run: env CONTENT_DIR=content make build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
