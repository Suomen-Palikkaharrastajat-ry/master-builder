# Starter .github/workflows/deploy.yml for a content repo (logo, website, guides).
# It is a thin caller of master-builder's reusable deploy-content workflow.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      builder_ref:
        description: "master-builder branch/tag/SHA to build with"
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: Suomen-Palikkaharrastajat-ry/master-builder/.github/workflows/deploy-content.yml@main
    with:
      builder_ref: ${{ inputs.builder_ref || 'main' }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
